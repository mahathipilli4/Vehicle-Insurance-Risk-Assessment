
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vehicle Insurance Risk Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #183153;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 35px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin: 0 0 12px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            color: #183153;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #245b8f;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #19456e;
        }

        .error {
            margin-top: 15px;
            color: #b91c1c;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="login-card">

        <div class="logo">🚗</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Vehicle Insurance Risk Assessment System
            <br>
            Sign in to access your dashboard.
        </p>

        <form action="{{ url_for('login') }}" method="POST">

            <label for="role">Select Role</label>

            <select id="role" name="role" required>
                <option value="">Choose your role</option>
                <option value="Admin">Admin</option>
                <option value="Analyst">Analyst</option>
                <option value="Underwriter">Underwriter</option>
            </select>

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="footer">
            Vehicle Insurance Risk Assessment System
        </div>

    </main>
</body>
</html>
